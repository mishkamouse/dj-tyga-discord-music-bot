services:
  bot:
    build: .
    env_file: .env
    security_opt:
      - no-new-privileges:true
    environment:
      # Talk to sidecars over the compose network instead of localhost.
      YTDLP_POT_PROVIDER_URL: http://pot-provider:4416
      YTDLP_PROXY_URL: socks5://warp:1080
      AUDIO_PROXY_URL: http://warp:8080
      STRANDS_AGENT_URL: http://strands-agent:8000
    volumes:
      # Persists the /radio artist rotation (data/radio-artists.json) across restarts and
      # redeploys, not just container restarts.
      - ./data:/app/data:Z
    depends_on:
      - pot-provider
      - strands-agent
      - warp
    restart: unless-stopped

  # Keeps yt-dlp extraction working reliably. See "How it works" in the README.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Optional, on by default: a best-effort attempt at reliable playback when this runs on a
  # cloud host, not a guarantee. See "How it works" in the README for what it does and why
  # it can stop helping under heavy use, and docker-compose.no-warp.yml to run without it
  # (recommended if you're on a residential connection, or have your own residential/static
  # proxy set via YTDLP_PROXY_URL/AUDIO_PROXY_URL already). warp-data persists WARP's device
  # registration across restarts so it isn't re-registered every time.
  #
  # No `no-new-privileges` here, unlike the other three services: this image's entrypoint
  # uses `sudo` to run warp-svc as root, and that flag blocks sudo's setuid escalation
  # outright (with it set, the container logs "sudo: the 'no new privileges' flag is set"
  # and never starts). It already runs unprivileged otherwise, no cap_add, no
  # /dev/net/tun; `docker inspect` on the deployed instance shows Privileged: false,
  # CapAdd: [].
  warp:
    image: dublok/cloudflare-warp:latest
    restart: unless-stopped
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  # Natural-language queue control (/ask). Its tools only reach the bot's internal API
  # (queue read/add/remove/etc, scoped per guild) over the compose network. Neither this
  # service nor the bot's internal API port is published to the host.
  strands-agent:
    build: ./agent
    env_file: .env
    security_opt:
      - no-new-privileges:true
    environment:
      BOT_INTERNAL_API_URL: http://bot:8100
    restart: unless-stopped

volumes:
  warp-data:
